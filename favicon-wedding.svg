<svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .petal { fill: #e8a0ae; }
        .center { fill: #b8952a; }
        @media (prefers-color-scheme: dark) {
            .petal { fill: #f0b0be; }
            .center { fill: #f0d480; }
        }
    </style>
    <!-- Sakura flower: 5 petals rotated around center -->
    <ellipse class="petal" cx="25" cy="17" rx="5" ry="8" transform="rotate(0, 25, 25)"/>
    <ellipse class="petal" cx="25" cy="17" rx="5" ry="8" transform="rotate(72, 25, 25)"/>
    <ellipse class="petal" cx="25" cy="17" rx="5" ry="8" transform="rotate(144, 25, 25)"/>
    <ellipse class="petal" cx="25" cy="17" rx="5" ry="8" transform="rotate(216, 25, 25)"/>
    <ellipse class="petal" cx="25" cy="17" rx="5" ry="8" transform="rotate(288, 25, 25)"/>
    <!-- Center -->
    <circle class="center" cx="25" cy="25" r="4"/>
</svg>
